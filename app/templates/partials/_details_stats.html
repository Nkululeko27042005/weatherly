<section id="detail-stats" class="card mt-3">
  <h2 class="text-lg font-bold text-brand-700 mb-2">Full detail</h2>

  <div class="grid grid--stats">
    <div class="stat">
      <div class="label">Wind speed</div>
      <div class="value"><span id="detail-wind">--</span></div>
    </div>
    <div class="stat">
      <div class="label">Wind direction</div>
      <div class="value"><span id="detail-wind-dir">--</span>°</div>
    </div>
    <div class="stat">
      <div class="label">Feels like</div>
      <div class="value"><span id="detail-feels">--</span></div>
    </div>
    <div class="stat">
      <div class="label">Humidity</div>
      <div class="value"><span id="detail-humidity">--</span>%</div>
    </div>
    <div class="stat">
      <div class="label">Pressure</div>
      <div class="value"><span id="detail-pressure">--</span> hPa</div>
    </div>
    <div class="stat">
      <div class="label">Cloud cover</div>
      <div class="value"><span id="detail-clouds">--</span>%</div>
    </div>
    <div class="stat">
      <div class="label">Visibility</div>
      <div class="value"><span id="detail-visibility">--</span></div>
    </div>
    <div class="stat">
      <div class="label">Rain (chance)</div>
      <div class="value"><span id="detail-pop">--</span>%</div>
    </div>
  </div>

  <div class="mt-3 flex-between" style="flex-wrap:wrap;gap:10px">
  <div id="aqi-host">
    <span class="text-muted text-xs">AQI loading…</span>
  </div>
  <div style="flex:1 1 200px">
    <div id="comfort-host"></div>
  </div>
</div>

  <div class="mt-3 text-xs text-muted">
    Sunrise <span id="detail-sunrise">--</span> · Sunset <span id="detail-sunset">--</span>
  </div>
</section>
